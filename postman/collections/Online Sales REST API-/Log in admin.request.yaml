$kind: http-request
url: "{{base_url}}/auth/login"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: "{\r

    \  \"email\": \"admin@example.com\",\r

    \  \"password\": \"Admin12345!\",\r

    \  \"device_name\": \"Postman Admin\"\r

    }"
scripts:
  - type: afterResponse
    code: pm.collectionVariables.set('admin_token', pm.response.json().access_token);
    language: text/javascript
order: 14000
