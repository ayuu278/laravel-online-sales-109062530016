$kind: http-request
name: Checkout
url: "{{base_url}}/checkout"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: "{\r

    \  \"recipient_name\": \"Ayu\",\r

    \  \"phone\": \"081234567890\",\r

    \  \"address\": \"Jl. Praktikum No. 10, Semarang\",\r

    \  \"shipping_service_id\": 1,\r

    \  \"items\": [\r

    \    {\"product_id\": 1, \"quantity\": 2}\r

    \  ]\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{customer_token}}"
scripts:
  - type: afterResponse
    code: pm.collectionVariables.set('order_id', pm.response.json().data.id);
    language: text/javascript
order: 15000
