$kind: http-request
url: "{{base_url}}/auth/me"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{customer_token}}"
scripts:
  - type: afterResponse
    code: pm.collectionVariables.set('order_id', pm.response.json().data.id);
    language: text/javascript
order: 10000
